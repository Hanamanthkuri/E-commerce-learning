<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== Reset ===== */
* {
    box-sizing: border-box;
}

/* ===== Body ===== */
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
}

/* ===== Profile Card ===== */
.profile-box {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
    animation: slideFade 1s ease;
    transition: transform 0.3s, box-shadow 0.3s;
}

.profile-box:hover {
    transform: translateY(-8px);
    box-shadow: 0 35px 70px rgba(0, 0, 0, 0.25);
}

/* ===== Header ===== */
.profile-box h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #4f46e5;
    position: relative;
}

.profile-box h2::after {
    content: "";
    width: 60px;
    height: 3px;
    background: #4f46e5;
    display: block;
    margin: 8px auto 0;
    border-radius: 5px;
}

/* ===== Profile Info ===== */
.profile-box p {
    font-size: 15px;
    margin: 12px 0;
    line-height: 1.6;
}

.profile-box strong {
    color: #111827;
}

.profile-box span {
    color: #4b5563;
}

/* ===== Links ===== */
.profile-box a {
    display: inline-block;
    margin-top: 18px;
    text-decoration: none;
    color: #4f46e5;
    font-weight: 600;
    transition: color 0.3s;
}

.profile-box a:hover {
    color: #1e1b4b;
    text-decoration: underline;
}

/* ===== Footer Text ===== */
.footer-text {
    margin-top: 18px;
    color: #ffffff;
    font-size: 14px;
}

.footer-text a {
    color: #fde68a;
    font-weight: 600;
    text-decoration: none;
}

.footer-text a:hover {
    text-decoration: underline;
}

/* ===== Animation ===== */
@keyframes slideFade {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ===== Responsive ===== */
@media (max-width: 480px) {
    .profile-box {
        padding: 22px;
    }
}
</style>
</head>

<body>

<div class="profile-box">
    <h2>Student Profile</h2>

    <p><strong>Name:</strong> <span id="pname"></span></p>
    <p><strong>Email:</strong> <span id="pemail"></span></p>
    <p><strong>Course:</strong> <span id="pcourse"></span></p>
    <p><strong>Bio:</strong> <span id="pbio"></span></p>

    <a href="home.html">← Back to Home</a>
</div>

<p class="footer-text">
    Don't have a profile?
    <a href="profile.html">Register here</a>
</p>

<script>
document.getElementById("pname").innerText = localStorage.getItem("name") || "—";
document.getElementById("pemail").innerText = localStorage.getItem("email") || "—";
document.getElementById("pcourse").innerText = localStorage.getItem("course") || "—";
document.getElementById("pbio").innerText = localStorage.getItem("bio") || "—";
</script>

</body>
</html>
